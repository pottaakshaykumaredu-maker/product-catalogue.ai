<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Product Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Navigation -->
  <header class="site-header">
    <a href="index.html" class="brand-link">🛍️ Product Store</a>
    <form class="search-form" onsubmit="handleSearchSubmit(event)">
      <input type="text" id="searchInput" placeholder="Search products...">
      <button type="submit">Search</button>
    </form>
    <nav class="nav-links">
      <a href="catalogue.html">Catalogue</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <span id="userAccountSection"><a href="login.html" style="text-decoration:underline;">Login</a></span>
      <a href="cart.html" class="cart-btn">🛒 Cart <span id="cartBadge" class="badge">0</span></a>
    </nav>
  </header>

  <!-- Login Form Section -->
  <main class="page-container">
    <div class="form-card">
      <h1 style="font-size:22px; margin-bottom:6px;">Sign In to Product Store</h1>
      <p style="color:#64748b; font-size:13px; margin-bottom:16px;">Manage your orders, wishlist, and fast checkout.</p>

      <form onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label>Email Address or Mobile</label>
          <input type="text" id="loginEmailInput" required placeholder="Enter email or mobile">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPasswordInput" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-submit">Login</button>
        <button type="button" onclick="autoFillDemoLogin()" style="width:100%; margin-top:8px; padding:8px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:4px; font-size:13px; cursor:pointer;">Auto-fill Demo Credentials</button>
      </form>

      <p style="text-align:center; margin-top:16px; font-size:13px; color:#64748b;">
        New to Product Store? <a href="register.html" style="color:#2874f0; font-weight:700;">Create an account</a>
      </p>
    </div>
  </main>

  <div id="toastNotification" class="toast-msg"></div>
  <footer class="site-footer">
    <p>© 2026 Product Store E-Commerce. Clean, friendly and simple code.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
