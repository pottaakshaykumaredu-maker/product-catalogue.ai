<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Product Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Navigation -->
  <header class="site-header">
    <a href="index.html" class="brand-link">🛍️ Product Store</a>
    <form class="search-form" onsubmit="handleSearchSubmit(event)">
      <input type="text" id="searchInput" placeholder="Search products...">
      <button type="submit">Search</button>
    </form>
    <nav class="nav-links">
      <a href="catalogue.html">Catalogue</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <span id="userAccountSection"><a href="login.html">Login</a></span>
      <a href="cart.html" class="cart-btn">🛒 Cart <span id="cartBadge" class="badge">0</span></a>
    </nav>
  </header>

  <!-- Register Form Section -->
  <main class="page-container">
    <div class="form-card">
      <h1 style="font-size:22px; margin-bottom:6px;">Create New Account</h1>
      <p style="color:#64748b; font-size:13px; margin-bottom:16px;">Sign up today to start shopping with exclusive member deals.</p>

      <form onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regNameInput" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmailInput" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="regPhoneInput" maxlength="10" placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassInput" required placeholder="Create password">
        </div>
        <button type="submit" class="btn-submit">Register Account</button>
      </form>

      <p style="text-align:center; margin-top:16px; font-size:13px; color:#64748b;">
        Already have an account? <a href="login.html" style="color:#2874f0; font-weight:700;">Login here</a>
      </p>
    </div>
  </main>

  <div id="toastNotification" class="toast-msg"></div>
  <footer class="site-footer">
    <p>© 2026 Product Store E-Commerce. Clean, friendly and simple code.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
