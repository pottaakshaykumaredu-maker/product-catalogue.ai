<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Product Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Navigation -->
  <header class="site-header">
    <a href="index.html" class="brand-link">🛍️ Product Store</a>
    <form class="search-form" onsubmit="handleSearchSubmit(event)">
      <input type="text" id="searchInput" placeholder="Search products...">
      <button type="submit">Search</button>
    </form>
    <nav class="nav-links">
      <a href="catalogue.html">Catalogue</a>
      <a href="about.html">About</a>
      <a href="contact.html" style="text-decoration:underline;">Contact</a>
      <span id="userAccountSection"><a href="login.html">Login</a></span>
      <a href="cart.html" class="cart-btn">🛒 Cart <span id="cartBadge" class="badge">0</span></a>
    </nav>
  </header>

  <!-- Contact Us Form Section -->
  <main class="page-container">
    <div class="form-card">
      <h1 style="font-size:22px; margin-bottom:8px;">Contact Support Desk</h1>
      <p style="color:#64748b; font-size:13px; margin-bottom:16px;">Have a question about orders or products? Send us a message.</p>

      <div id="contactSuccessAlert" style="display:none; padding:10px; background:#dcfce7; color:#15803d; border-radius:4px; margin-bottom:12px; font-weight:600; font-size:13px;"></div>

      <form onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="contactNameInput" required placeholder="Full Name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="contactEmailInput" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="contactMessageInput" rows="4" required placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </main>

  <div id="toastNotification" class="toast-msg"></div>
  <footer class="site-footer">
    <p>© 2026 Product Store E-Commerce. Clean, friendly and simple code.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
