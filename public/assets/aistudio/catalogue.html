<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalogue - Product Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Navigation -->
  <header class="site-header">
    <a href="index.html" class="brand-link">🛍️ Product Store</a>
    <form class="search-form" onsubmit="handleSearchSubmit(event)">
      <input type="text" id="searchInput" placeholder="Search catalogue...">
      <button type="submit">Search</button>
    </form>
    <nav class="nav-links">
      <a href="catalogue.html" style="text-decoration:underline;">Catalogue</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <span id="userAccountSection"><a href="login.html">Login</a></span>
      <a href="cart.html" class="cart-btn">🛒 Cart <span id="cartBadge" class="badge">0</span></a>
    </nav>
  </header>

  <!-- Product Catalogue Section -->
  <main class="page-container">
    <div class="section-title">
      <h1>All Products Catalogue</h1>
      <span id="catalogueCountText" style="font-size:14px; color:#64748b; font-weight:500;"></span>
    </div>

    <!-- Category Filters & Sorting -->
    <div class="filter-bar">
      <div class="cat-pills">
        <button class="cat-pill-btn active" onclick="setCatalogueCategory('all')">All Items</button>
        <button class="cat-pill-btn" onclick="setCatalogueCategory('electronics')">Electronics</button>
        <button class="cat-pill-btn" onclick="setCatalogueCategory('fashion')">Fashion</button>
        <button class="cat-pill-btn" onclick="setCatalogueCategory('home')">Home</button>
        <button class="cat-pill-btn" onclick="setCatalogueCategory('appliances')">Appliances</button>
        <button class="cat-pill-btn" onclick="setCatalogueCategory('books')">Books</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <select onchange="handleSortSelectChange(this.value)" style="padding:6px 10px; border-radius:4px; border:1px solid #cbd5e1; font-size:13px;">
          <option value="popular">Sort: Popularity</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
        <button onclick="resetAllFilters()" style="padding:6px 12px; background:#fff; border:1px solid #cbd5e1; border-radius:4px; font-size:13px; cursor:pointer;">Reset</button>
      </div>
    </div>

    <!-- Product Grid Container -->
    <div id="catalogueGrid" class="product-grid"></div>
  </main>

  <div id="toastNotification" class="toast-msg"></div>
  <footer class="site-footer">
    <p>© 2026 Product Store E-Commerce. Clean, friendly and simple code.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
